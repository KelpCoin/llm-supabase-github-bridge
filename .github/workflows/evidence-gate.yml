name: Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check evidence contract present
        run: |
          test -f docs/evidence-contract.md
          test -f docs/agent-ping-protocol.md
          test -f docs/figure-eight-status.json
          test -f supabase/migrations/20260917120000_evidence_core.sql
          echo "Evidence contract, agent protocol, figure-eight status, and core schema present"

      - name: Validate public archive contains no live economic state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          docs=["docs/cloud-inventory.json","docs/figure-eight-status.json"]
          for p in docs:
              data=json.loads(Path(p).read_text())
              assert data["schema"]=="public-reference-retirement/v1",p
              assert data["status"]=="RETIRED",p
              for forbidden in ("supabase_project","orchestration_authority","verified_external_revenue_nzd","cmd_diag_29_payment_link","control_plane"):
                  assert forbidden not in data,p
          for p in ("README.md","docs/autonomous-cloud-map.md","docs/agent-ping-protocol.md","docs/local-first.md"):
              body=Path(p).read_text()
              for forbidden in ("control_bridge_notes","claim_local_gpu_bridge_note","KelpCoin/DreamLedger AGENT_BUS","BECK-Collab-Inbox","Supabase Cron runs","BECK_PRIVATE_LLM"):
                  assert forbidden not in body,p
          print("PUBLIC_REFERENCE_PRIVACY=PASS; ECONOMIC_TRUTH=NOT_ESTABLISHED")
          PY

      - name: Validate SQL syntax (basic)
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS evidence_events" supabase/migrations/20260917120000_evidence_core.sql
          grep -q "CREATE TABLE IF NOT EXISTS economic_events" supabase/migrations/20260917120000_evidence_core.sql
          grep -q "CREATE TABLE IF NOT EXISTS fossils" supabase/migrations/20260917120000_evidence_core.sql
          grep -q "CREATE TABLE IF NOT EXISTS oracle_verdicts" supabase/migrations/20260917120000_evidence_core.sql
          echo "Core tables declared"

      - name: Check no secrets in repo
        run: |
          if grep -rE "(sk_live_|sk_test_|whsec_|SUPABASE_SERVICE_ROLE)" --include="*.{ts,js,py,sql,md,yml,yaml}" . ; then
            echo "Possible secret detected — fail"
            exit 1
          fi
          echo "No obvious secrets found"

      - name: Emit machine-readable proof
        run: |
          mkdir -p proof
          cat > proof/EVIDENCE-GATE.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "sha": "${{ github.sha }}",
            "verdict": "PASS_ARCHIVED_REFERENCE_ONLY",
            "checks": ["contract_present", "retired_archive_privacy", "schema_tables", "no_secrets"],
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat proof/EVIDENCE-GATE.json

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-gate-proof
          path: proof/
